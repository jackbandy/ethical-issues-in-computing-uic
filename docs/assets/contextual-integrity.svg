<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original diagram of contextual integrity (Nissenbaum 2004), parameters as named in Malkin, "Contextual Integrity, Explained," IEEE Security & Privacy 21(1), 2023.
  NOTICE: drawn by an LLM (Claude Code) in the house style of docs/assets/STYLE.md.
-->
<svg width="1000" height="618" viewBox="0 0 1000 618" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="head" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" markerUnits="strokeWidth" orient="auto">
            <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#111111"/>
        </marker>
    </defs>
    <style>
        .h { font-family: "Big Shoulders", "Arial Narrow", "Helvetica Neue Condensed", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 1px; }
        .t { font-family: "Mulish", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; }
        .e { font-family: "Mulish", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; font-style: italic; }
    </style>
    <rect width="1000" height="618" fill="#ffffff"/>

    <!-- context frame -->
    <rect x="20" y="20" width="960" height="578" rx="6" fill="none" stroke="#aaaaaa" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="44" y="60" class="h" fill="#666666">CONTEXT: HEALTH CARE</text>
    <text x="44" y="88" class="t" fill="#666666">governed by norms (expectations)</text>

    <!-- subject -->
    <rect x="390" y="110" width="220" height="100" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="500" y="148" text-anchor="middle" class="h" fill="#111111">SUBJECT</text>
    <text x="500" y="174" text-anchor="middle" class="t" fill="#111111">who it is about</text>
    <text x="500" y="198" text-anchor="middle" class="e" fill="#555555">e.g., the patient</text>
    <line x1="500" y1="214" x2="500" y2="301" stroke="#111111" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- sender -->
    <rect x="50" y="305" width="230" height="100" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="165" y="343" text-anchor="middle" class="h" fill="#111111">SENDER</text>
    <text x="165" y="369" text-anchor="middle" class="t" fill="#111111">who shares it</text>
    <text x="165" y="393" text-anchor="middle" class="e" fill="#555555">e.g., the patient</text>

    <!-- information type (focal) -->
    <rect x="370" y="305" width="260" height="100" rx="6" fill="#00a1de" stroke="#111111" stroke-width="3"/>
    <text x="500" y="343" text-anchor="middle" class="h" fill="#ffffff">INFORMATION TYPE</text>
    <text x="500" y="369" text-anchor="middle" class="t" fill="#ffffff">what is shared</text>
    <text x="500" y="393" text-anchor="middle" class="e" fill="#ffffff">e.g., symptoms</text>

    <!-- recipient -->
    <rect x="720" y="305" width="230" height="100" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="835" y="343" text-anchor="middle" class="h" fill="#111111">RECIPIENT</text>
    <text x="835" y="369" text-anchor="middle" class="t" fill="#111111">who receives it</text>
    <text x="835" y="393" text-anchor="middle" class="e" fill="#555555">e.g., the doctor</text>

    <!-- flow arrows -->
    <line x1="284" y1="355" x2="356" y2="355" stroke="#111111" stroke-width="3" marker-end="url(#head)"/>
    <line x1="634" y1="355" x2="706" y2="355" stroke="#111111" stroke-width="3" marker-end="url(#head)"/>

    <!-- transmission principle -->
    <line x1="500" y1="409" x2="500" y2="466" stroke="#111111" stroke-width="3" stroke-dasharray="9 8"/>
    <rect x="310" y="470" width="380" height="100" rx="6" fill="#222222" stroke="#111111" stroke-width="3"/>
    <text x="500" y="508" text-anchor="middle" class="h" fill="#ffffff">TRANSMISSION PRINCIPLE</text>
    <text x="500" y="534" text-anchor="middle" class="t" fill="#ffffff">the conditions on the flow</text>
    <text x="500" y="558" text-anchor="middle" class="e" fill="#ffffff">e.g., confidentiality</text>
</svg>
