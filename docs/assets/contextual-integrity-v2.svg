<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original diagram of contextual integrity (Nissenbaum 2004), parameters as named in Malkin, "Contextual Integrity, Explained," IEEE Security & Privacy 21(1), 2023. v2 of contextual-integrity.svg.
  Embedded font: Big Shoulders (SIL OFL 1.1, see fonts/big-shoulders/OFL.txt), instanced at wght 700 / opsz 36 and subset to A–Z, colon, space, so headings render the same where the font is not installed.
  NOTICE: drawn by an LLM (Claude Code) in the house style of docs/assets/STYLE.md.
-->
<svg width="1000" height="618" viewBox="0 0 1000 618" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ci-title ci-desc">
    <title id="ci-title">Contextual integrity: five parameters of an information flow</title>
    <desc id="ci-desc">Inside a health-care context governed by norms, a sender (the patient) shares an information type (symptoms) with a recipient (the doctor). The information is about a subject (the patient). A transmission principle (confidentiality) spans the whole flow from sender to recipient.</desc>
    <defs>
        <marker id="head" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" markerUnits="strokeWidth" orient="auto">
            <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#111111"/>
        </marker>
    </defs>
    <style>
        @font-face { font-family: "CI Big Shoulders"; font-weight: 700; src: url("data:font/woff2;base64,") format("woff2"); }
        .h { font-family: "CI Big Shoulders", "Big Shoulders", "Arial Narrow", "Helvetica Neue Condensed", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 1px; }
        .t { font-family: "Mulish", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 24px; }
        .e { font-family: "Mulish", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 24px; font-style: italic; }
    </style>
    <rect width="1000" height="618" fill="#ffffff"/>

    <!-- context frame -->
    <rect x="20" y="20" width="960" height="578" rx="6" fill="none" stroke="#aaaaaa" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="44" y="62" class="h" fill="#666666">CONTEXT: HEALTH CARE</text>
    <text x="354" y="62" class="t" fill="#666666">governed by norms (expectations)</text>

    <!-- subject -->
    <rect x="385" y="118" width="230" height="110" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="500" y="158" text-anchor="middle" class="h" fill="#111111">SUBJECT</text>
    <text x="500" y="188" text-anchor="middle" class="t" fill="#111111">who it is about</text>
    <text x="500" y="216" text-anchor="middle" class="e" fill="#555555">e.g., the patient</text>
    <line x1="500" y1="232" x2="500" y2="286" stroke="#111111" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- sender -->
    <rect x="50" y="290" width="230" height="110" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="165" y="330" text-anchor="middle" class="h" fill="#111111">SENDER</text>
    <text x="165" y="360" text-anchor="middle" class="t" fill="#111111">who shares it</text>
    <text x="165" y="388" text-anchor="middle" class="e" fill="#555555">e.g., the patient</text>

    <!-- information type -->
    <rect x="360" y="290" width="280" height="110" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="500" y="330" text-anchor="middle" class="h" fill="#111111">INFORMATION TYPE</text>
    <text x="500" y="360" text-anchor="middle" class="t" fill="#111111">what is shared</text>
    <text x="500" y="388" text-anchor="middle" class="e" fill="#555555">e.g., symptoms</text>

    <!-- recipient -->
    <rect x="720" y="290" width="230" height="110" rx="6" fill="#eeeeee" stroke="#111111" stroke-width="3"/>
    <text x="835" y="330" text-anchor="middle" class="h" fill="#111111">RECIPIENT</text>
    <text x="835" y="360" text-anchor="middle" class="t" fill="#111111">who receives it</text>
    <text x="835" y="388" text-anchor="middle" class="e" fill="#555555">e.g., the doctor</text>

    <!-- flow arrows -->
    <line x1="284" y1="345" x2="348" y2="345" stroke="#111111" stroke-width="3" marker-end="url(#head)"/>
    <line x1="644" y1="345" x2="708" y2="345" stroke="#111111" stroke-width="3" marker-end="url(#head)"/>

    <!-- transmission principle (focal): bracket spans the whole sender-to-recipient flow -->
    <path d="M 165 404 V 422 H 835 V 404" fill="none" stroke="#111111" stroke-width="3"/>
    <line x1="500" y1="422" x2="500" y2="456" stroke="#111111" stroke-width="3"/>
    <rect x="290" y="460" width="420" height="110" rx="6" fill="#222222" stroke="#111111" stroke-width="3"/>
    <text x="500" y="500" text-anchor="middle" class="h" fill="#ffffff">TRANSMISSION PRINCIPLE</text>
    <text x="500" y="530" text-anchor="middle" class="t" fill="#ffffff">the conditions on the flow</text>
    <text x="500" y="558" text-anchor="middle" class="e" fill="#ffffff">e.g., confidentiality</text>
</svg>
