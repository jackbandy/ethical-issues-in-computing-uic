<!--
  Site masthead: the blue rail with a train car that glides across it.

  The train starts at a random point on the rail, glides once to whichever window
  edge is further away, and parks there. Neither of its edges ever crosses a window
  edge. Motion lives in the script below rather than in CSS keyframes because the
  start point is random and the travel bounds have to be measured against the real
  window width.

  Note: this file (styles and script) was largely written by an LLM-based coding system.
-->

<style>
  /* --masthead-train-height: rendered height of the train car artwork.
     Glide duration is SWEEP_MS in the script below. */
  :root {
    --masthead-train-height: 96px;
  }

  /* On a narrow screen the full-size car is nearly as wide as the window, so it
     has nowhere to glide. Scale it to 47% of the window width instead, keeping
     the artwork's 2440:400 aspect ratio (400 / 2440 = 0.1639). Sizing by height
     keeps the wheels-on-the-rail offset below in one place.

     47% is a deliberate middle: the car is big enough to read as a train on a
     phone (~188px wide at a 400px viewport, ~423px at 900px) while still leaving
     over half the window as rail for it to glide along. */
  @media (max-width: 900px) {
    :root {
      --masthead-train-height: calc(47vw * 0.1639);
    }
  }

  .ble-masthead {
    display: block;
    margin: 0 0 2rem;
    color: inherit;
    text-decoration: none;   /* whole masthead is a link to the homepage */
  }
  .ble-masthead__inner {
    /* Break out of any centered content column: the rail is the full window,
       so the train can drift all the way to each screen edge. */
    max-width: none;
    width: 100vw;
    margin: 0 0 0 calc(50% - 50vw);
    padding: 14px 0 0;
    line-height: 0;     /* no baseline gap beneath the artwork */
  }
  .ble-masthead__train {
    display: block;
    height: var(--masthead-train-height);
    width: auto;
    position: relative;
    /* The v4c artwork has ~17% empty space below the wheels (viewBox 0–400,
       wheels rest at y≈332). Pull the blue bar up by that much so the wheels
       sit directly on the line, like rails. */
    margin-bottom: calc(var(--masthead-train-height) * -0.17);
    will-change: transform;   /* the script animates transform */
  }
  .ble-masthead__bar {
    border: none;
    height: 12px;
    background-color: #00A1DE;
    width: 100vw;
    margin: 0 0 0 calc(50% - 50vw);
  }
</style>
<a class="ble-masthead" href="{{ site.baseurl }}/">
  <div class="ble-masthead__inner">
    <img class="ble-masthead__train"
         src="{{ site.baseurl }}/assets/trains/blue-line-ethics-masthead-v4c.svg"
         alt="Blue Line Ethics">
  </div>
  <hr class="ble-masthead__bar">
</a>
<script src="{{ site.baseurl }}/assets/js/masthead.js"></script>
