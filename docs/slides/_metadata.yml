format:
  revealjs:
    theme: theme/blue-line.scss
    css:
      - theme/responsive-footer.css
      - theme/radio-player.css
      - theme/random-letter.css
    include-in-header:
      - includes/head-icons.html
      - includes/crawler-policy.html
    include-after-body:
      - includes/slide-number-after-body.html
      - includes/footer-deck-link.html
      - includes/radio-player-after-body.html
      - includes/random-letter-after-body.html
      - includes/sources-fit-after-body.html
    width: 1280
    height: 720
    margin: 0
    slide-number: c/t
    controls: true
    progress: false
    transition: fade
    background-transition: fade
    footer: '<img src="../images/uic-black-logo.svg" alt="UIC logo"><img src="../images/cc-by-nc-sa-small.svg" alt="CC BY-NC-SA"><span class="footer-text">Ethical Issues in Computing (CS 377)</span><span class="footer-text"><a href="https://doethics.fun/slides/">doethics.fun/slides</a></span>'
bibliography: references.bib
# `#` headings are section dividers (day titles, `.section-header` slides,
# sources); `##` headings are the slides grouped under them, which is what
# the navigation menu (press M) lists by section.
slide-level: 2
