name: Build slides

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**"
      - ".gitignore"
      - "README.md"
      - ".github/workflows/build-slides.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Compile Quarto slides to HTML
        env:
          BUILD_PDFS: "false"
        run: cd docs/slides && bash ./build.sh

      - name: Commit compiled slide outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A over the whole dir so each deck's weekN_files/ assets are committed and
          # stale ones from a previous render are pruned. Build-only paths stay gitignored.
          git add -A docs/slides
          git diff --staged --quiet || (git commit -m "Build slides" && git push)
